<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuantX Core</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    nav {
      display: flex;
      background: #111;
      padding: 10px;
    }
    nav button {
      color: white;
      background: none;
      border: none;
      margin-right: 15px;
      cursor: pointer;
      font-size: 16px;
    }
    iframe {
      width: 100%;
      height: 90vh;
      border: none;
    }
  </style>
</head>
<body>

<nav>
  <button onclick="loadPage('eq')">EQ Tracker</button>
  <button onclick="loadPage('kcet')">KCET Tracker</button>
</nav>

<iframe id="viewer" src=""></iframe>

<script>
  function loadPage(type) {
    const viewer = document.getElementById('viewer');

    if (type === 'eq') {
      viewer.src = "https://sentinelcoredev.github.io/EQ-tracker/";
    } else if (type === 'kcet') {
      viewer.src = "https://sentinelcoredev.github.io/kcet-tracker/";
    }
  }

  // default load
  loadPage('eq');
</script>
<script data-goatcounter="https://sentinelcoredev.github.io/quantx.core/.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
